name: Count a vote

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: votes
  cancel-in-progress: false

jobs:
  vote:
    if: startsWith(github.event.issue.title, 'vote:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count the vote and redraw the chart
        id: count
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          VOTER: ${{ github.event.issue.user.login }}
        run: |
          result=$(python3 scripts/vote.py)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          python3 scripts/figures.py

      - name: Commit the new chart
        if: steps.count.outputs.result == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add votes.json assets/votes-*.svg
          git commit -m "Count a vote for the next Lerno lesson"
          git pull --rebase
          git push

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat reply.txt)"
