<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-label="10k+ users on Operate, built at Better. Won SIH 2025 among 68,000+ teams. 1st at CodeClash 2.0 among 1,000+ teams.">
<title>10k+ users on Operate, built at Better. Won SIH 2025 among 68,000+ teams. 1st at CodeClash 2.0 among 1,000+ teams.</title>
<style>
